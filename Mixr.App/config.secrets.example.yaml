# Mixr — Vorlage für lokale Zugangsdaten (Twitch/IGDB für Spiele-Cover).
#
# Die echte Datei heißt config.secrets.yaml und liegt im Datenordner der App:
#   %LOCALAPPDATA%\Mixr\config.secrets.yaml
# Sie lässt sich auch in der App unter Einstellungen → Spiele-Cover (IGDB) eintragen.
# Niemals ins Repository committen. Umgebungsvariablen IGDB_CLIENT_ID / IGDB_CLIENT_SECRET haben Vorrang.
#
# Eigene Twitch-Anwendung anlegen: https://dev.twitch.tv/console/apps
igdb:
  client_id: "DEINE_TWITCH_CLIENT_ID"
  client_secret: "DEIN_TWITCH_CLIENT_SECRET"
