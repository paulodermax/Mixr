name: CI

on:
  push:
    branches: [main, "release/**"]
    paths-ignore: ["**.md", "Docs/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Windows-App (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mixr.sln

      - name: Build
        run: dotnet build Mixr.sln -c Release --no-restore -warnaserror:NU1701

      - name: Test
        run: dotnet test PC.Tests/PC.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  firmware:
    name: Firmware (ESP-IDF, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Produkt-Firmware: USB-HID-Composite (Vendor-HID + Medientasten)
          - variant: hid
            defaults: sdkconfig.defaults
          # Legacy/Bench: USB-Serial/JTAG mit 0xAA-Framing — darf nicht verrotten
          - variant: serial
            defaults: sdkconfig.defaults;sdkconfig.variant.serial
          # Entwickler-Firmware: HID + CDC-Debugkonsole
          - variant: debugcdc
            defaults: sdkconfig.defaults;sdkconfig.variant.debugcdc
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: ESP
          command: idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-ci-${{ matrix.variant }}
          path: |
            ESP/build/Mixr.bin
            ESP/build/bootloader/bootloader.bin
            ESP/build/partition_table/partition-table.bin
