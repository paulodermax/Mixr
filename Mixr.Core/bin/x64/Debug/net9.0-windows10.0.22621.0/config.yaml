# com_port: leer, „auto“ oder weglassen = automatisch (ESP32-S3 USB Serial/JTAG, VID 303A / PID 1001).
# Festen Port nur bei Bedarf: com_port: COM7  — auch: --port=COM7  --baud=921600
com_port: auto
baud_rate: 921600

# Slider 1–4 → Windows (Reihenfolge = ESP-Index 0..3)
# invert_sliders: true — falls Hardware „hoch = leiser“
invert_sliders: false

slider_mapping:
  - master
  - communication
  - media
  - games

# Taster 0–4: smtc_previous | smtc_play_pause | smtc_next | discord_mute | discord_deafen | none
button_mapping:
  - smtc_previous
  - smtc_play_pause
  - smtc_next
  - discord_mute
  - discord_deafen

# Pro Gruppe: Suchstrings im Session-Namen (DisplayName / Prozess)
session_groups:
  communication:
    - Discord
    - Teams
    - Teamspeak
  media:
    - Chrome
    - Brave
    - Spotify
    - Firefox
  games:
    - DayZ
    - Stardew Valley
    - Battlefield 6
    - Icarus
    - Rocket League
    - Enshrouded
    - Terraria
    - Rust
    - Diablo III
    - Steam
    - Battle.net
    - SlimeRancher

