# Wie workdir: serieller Port zum ESP (Mixr). Überschreibbar mit: --port=COM7  --baud=921600
com_port: auto
baud_rate: 921600

# Slider 1–4 → Windows (Reihenfolge = ESP-Index 0..3)
# invert_sliders: true — falls Hardware „hoch = leiser“
invert_sliders: false

slider_mapping:
  - master
  - communication
  - media
  - games

# Pro Gruppe: Suchstrings im Session-Namen (DisplayName / Prozess)
session_groups:
  communication:
    - Discord
    - Teams
    - Teamspeak
  media:
    - Chrome
    - Brave
    - Spotify
    - Firefox
  games:
    - DayZ
    - Stardew Valley
    - Battlefield 6
    - Icarus
    - Rocket League
    - Enshrouded
    - Terraria
    - Rust
    - Diablo III
    - Steam
    - Battle.net
    - SlimeRancher

# Taster-Mapping fest in Program.cs: 0 Previous, 1 Play/Pause, 2 Next, 3 Mute, 4 Deafen
